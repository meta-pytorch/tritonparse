name: Tests

on:
    push:
        branches: [main, develop]
        paths-ignore:
            - "website/**"
            - "docs/**"
            - "*.md"
            - ".gitignore"
    pull_request:
        branches: [main]
        paths-ignore:
            - "website/**"
            - "docs/**"
            - "*.md"
            - ".gitignore"
    workflow_dispatch:
        inputs:
            test-type:
                description: "Type of tests to run"
                required: true
                default: "all"
                type: choice
                options:
                    - "all"
                    - "cpu"
                    - "cuda"
            coverage:
                description: "Enable coverage reporting"
                required: true
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    format-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6

            - name: Set up Python 3.14
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install development dependencies
              run: |
                  make install-dev

            - name: Check code formatting
              run: |
                  make format-check || (echo "❌ Format check failed. Please run 'make format' to fix formatting issues, then commit the changes." && echo "📖 For detailed formatting guide, see: https://github.com/meta-pytorch/tritonparse/wiki/05.-Code-Formatting" && exit 1)

            - name: Check Python lint
              run: |
                  make lint-check || (echo "❌ Lint check failed. Please run 'make lint' to fix lint issues, then commit the changes." && exit 1)

    # ===================================================================
    # GPU tests on PyTorch self-hosted runner: AWS g5.4xlarge / NVIDIA
    # A10G, ephemeral EC2 (1 job per VM, no cross-PR pollution).
    #
    # Architecture: `runs-on:` + `container:` (helion-style). We run the
    # job directly inside the `pytorch/almalinux-builder:cuda13.0`
    # docker image (AlmaLinux 8.10 + CUDA 13.0 toolkit + conda 23.5.2 in
    # /opt/conda + Python 3.11 base env). The host AMI provides the
    # NVIDIA driver (580.65.06) and nvidia-container-toolkit; the
    # container picks them up via `--gpus all`.
    #
    # We bypass `pytorch/test-infra/linux_job_v2.yml` to retain native
    # `actions/cache` support (the reusable workflow's opaque `script:`
    # block prevents standard caching). This trade-off costs us the
    # reusable workflow's auto NVIDIA driver freshness check, but the
    # AMI's pre-installed driver has been verified working.
    #
    # `.ci/setup.sh` is intentionally NOT called here — it targets a
    # GitHub-hosted Ubuntu fresh-image runner and is kept for local
    # development only. The container ships with everything we need.
    #
    # Why CUDA 13.0 (not 13.2): host driver on G5 runners (580.65.06)
    # exposes CUDA runtime 13.0; cuda13.2 image fails the
    # nvidia-container-cli capability check ("unsatisfied condition:
    # cuda>=13.2"). Bump once PyTorch infra rolls out a newer driver
    # AMI. Probed on 2026-04-29.
    # ===================================================================
    test-from-nightly:
        runs-on: linux.g5.4xlarge.nvidia.gpu
        container:
            image: pytorch/almalinux-builder:cuda13.0
            options: --gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --shm-size=2g --ipc=host
        timeout-minutes: 60
        env:
            # A10G compute capability (Ampere)
            TORCH_CUDA_ARCH_LIST: "8.6"
            CONDA_ENV: tritonparse
            PYTHON_VERSION: "3.14"
            PYTORCH_CUDA_TAG: cu130
            # NVIDIA-published Triton nightly wheel index (cp310-cp314,
            # x86_64 + aarch64). The "Triton-Nightly" is the *feed* name;
            # the package is just `triton`. Versions look like
            # 3.7.0+gitXXXXXXXX.
            TRITON_NIGHTLY_INDEX_URL: "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/Triton-Nightly/pypi/simple/"
        steps:
            - uses: actions/checkout@v6

            - name: Mark workspace as safe for git
              # actions/checkout sets safe.directory in a *temporary* HOME
              # that is discarded after the step. Subsequent git invocations
              # (e.g. setuptools-scm during 'pip install -e .') see the
              # workspace as ec2-user-owned (uid 1000) while the container
              # runs as root (uid 0), and refuse with 'dubious ownership'.
              # Persist the safe.directory in /github/home/.gitconfig so all
              # later steps inherit it.
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Get daily cache timestamp
              id: daily-cache
              run: |
                  # Calculate date (e.g., 2024-01-15) for daily cache expiration
                  DATE_STAMP=$(date +"%Y-%m-%d")
                  echo "date=$DATE_STAMP" >> $GITHUB_OUTPUT
                  echo "Using daily cache stamp: $DATE_STAMP"

            - name: Cache pip dependencies
              uses: actions/cache@v5
              with:
                  # GitHub Actions sets HOME=/github/home in container jobs,
                  # so pip's default cache directory ($HOME/.cache/pip per
                  # XDG) is /github/home/.cache/pip — NOT /root/.cache/pip.
                  path: /github/home/.cache/pip
                  key: ${{ runner.os }}-pip-${{ env.PYTORCH_CUDA_TAG }}-py${{ env.PYTHON_VERSION }}-${{ steps.daily-cache.outputs.date }}
                  restore-keys: |
                      ${{ runner.os }}-pip-${{ env.PYTORCH_CUDA_TAG }}-py${{ env.PYTHON_VERSION }}-

            - name: Setup conda env + PyTorch nightly + Triton nightly
              env:
                  # Provided so the Triton-nightly resolver below can
                  # authenticate to the GitHub Actions API. Without this,
                  # we hit the 60 req/hr unauthenticated limit (shared per
                  # runner IP across all repos using the runner pool) and
                  # fall back to the unpinned install. With the workflow
                  # token, the limit is 1000/hr per repo and the only
                  # permission we need is read access to triton-lang/triton
                  # (a public repo), which the default GITHUB_TOKEN already
                  # has.
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  # Container ships with conda 23.5.2 in /opt/conda
                  # (Py3.11 base). Create a fresh Py3.14 env for tritonparse.
                  eval "$(/opt/conda/bin/conda shell.bash hook)"
                  conda create -n "$CONDA_ENV" python="$PYTHON_VERSION" -y -c conda-forge
                  conda activate "$CONDA_ENV"

                  # Install PyTorch nightly with CUDA runtime matching the
                  # container toolkit. This pulls a pinned `pytorch-triton`
                  # snapshot which we replace below with the upstream
                  # NVIDIA Triton nightly.
                  pip install --pre torch torchvision torchaudio \
                      --index-url "https://download.pytorch.org/whl/nightly/${PYTORCH_CUDA_TAG}"
                  # Workaround: PyTorch nightly missing 'packaging' dep.
                  pip install packaging

                  # Replace the pytorch-triton snapshot with the upstream
                  # Triton nightly (NVIDIA's official feed). Both packages
                  # provide `import triton`, so we uninstall any existing
                  # variant first to avoid a half-overwritten install.
                  pip uninstall -y pytorch-triton triton 2>/dev/null || true

                  # Workaround: the Triton-Nightly feed publishes wheels
                  # with PEP-440 local versions like `3.7.0+gitXXXXXXXX`,
                  # which pip sorts lexicographically — so `pip install -U`
                  # silently selects an arbitrarily-old wheel rather than
                  # the newest commit. We resolve the latest upstream
                  # wheels.yml head_sha via GitHub API and pin to it.
                  # The resolver runs under the active conda env's python
                  # here (just whatever `python` resolves to on PATH); it
                  # doesn't matter because the script is stdlib-only and
                  # PY_TAG is derived from that same interpreter, so the
                  # platform tag we filter on always matches the install
                  # target. On any resolver failure, fall back to the
                  # unpinned install (preserves the original behavior so
                  # this leg never regresses).
                  PY_TAG=$(python -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')
                  PIN=$(python .ci/triton_nightly_pin.py --pytag "$PY_TAG" --platform x86_64) || PIN=""
                  if [[ "$PIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+git[0-9a-f]+$ ]]; then
                      echo "Pinning Triton nightly to upstream HEAD: triton==$PIN"
                      pip install "triton==$PIN" \
                          --extra-index-url "${TRITON_NIGHTLY_INDEX_URL}"
                  else
                      echo "Resolver did not produce a valid pin (got: '$PIN'); falling back to default"
                      pip install -U --pre triton \
                          --extra-index-url "${TRITON_NIGHTLY_INDEX_URL}"
                  fi
                  python -c "import triton; print(f'Triton: {triton.__version__} from {triton.__file__}')"

            - name: Install project dependencies
              run: |
                  bash .ci/install-project.sh

            - name: Run tests
              env:
                  TEST_TYPE: ${{ github.event.inputs.test-type || 'all' }}
                  COVERAGE: ${{ github.event.inputs.coverage || 'false' }}
              run: |
                  bash .ci/run-tests.sh

    test-from-pip:
        runs-on: linux.g5.4xlarge.nvidia.gpu
        container:
            image: pytorch/almalinux-builder:cuda13.0
            options: --gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --shm-size=2g --ipc=host
        timeout-minutes: 60
        env:
            TORCH_CUDA_ARCH_LIST: "8.6"
            CONDA_ENV: tritonparse-pip
            PYTHON_VERSION: "3.14"
            PYTORCH_CUDA_TAG: cu130
        steps:
            - uses: actions/checkout@v6

            - name: Mark workspace as safe for git
              # See test-from-source for the rationale (setuptools-scm needs
              # git introspection during 'pip install -e .').
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Get daily cache timestamp
              id: daily-cache
              run: |
                  DATE_STAMP=$(date +"%Y-%m-%d")
                  echo "date=$DATE_STAMP" >> $GITHUB_OUTPUT
                  echo "Using daily cache stamp: $DATE_STAMP"

            - name: Cache pip dependencies
              uses: actions/cache@v5
              with:
                  # See test-from-source for the rationale (HOME=/github/home
                  # in container jobs, pip cache lives there).
                  path: /github/home/.cache/pip
                  key: ${{ runner.os }}-pip-${{ env.PYTORCH_CUDA_TAG }}-py${{ env.PYTHON_VERSION }}-${{ steps.daily-cache.outputs.date }}
                  restore-keys: |
                      ${{ runner.os }}-pip-${{ env.PYTORCH_CUDA_TAG }}-py${{ env.PYTHON_VERSION }}-

            - name: Setup conda env + PyTorch nightly
              run: |
                  eval "$(/opt/conda/bin/conda shell.bash hook)"
                  conda create -n "$CONDA_ENV" python="$PYTHON_VERSION" -y -c conda-forge
                  conda activate "$CONDA_ENV"

                  # PyTorch nightly bundles its own pytorch-triton, so no
                  # source build of Triton needed in this job.
                  pip install --pre torch torchvision torchaudio \
                      --index-url "https://download.pytorch.org/whl/nightly/${PYTORCH_CUDA_TAG}"
                  pip install packaging

            - name: Install project dependencies
              run: |
                  bash .ci/install-project.sh

            - name: Run tests
              env:
                  TEST_TYPE: ${{ github.event.inputs.test-type || 'all' }}
                  COVERAGE: ${{ github.event.inputs.coverage || 'false' }}
              run: |
                  bash .ci/run-tests.sh

    # ===================================================================
    # GPU tests on AMD MI350 (gfx950) self-hosted runner, ROCm nightly.
    #
    # Architecture: host-direct (NO `container:`). Unlike the NVIDIA
    # jobs, we do not run inside a container image: ROCm needs
    # /dev/kfd + /dev/dri device passthrough, and the runner host
    # already ships a working ROCm stack + driver. This mirrors how
    # pytorch/pytorch runs its own MI350 CI
    # (rocm-mi350.yml -> linux.rocm.gpu.gfx950.1, docker-less test
    # path via _rocm-test.yml).
    #
    # Runner: `amd-mi350-runner` is the repo-visible ARC scale set
    # (ephemeral, 1 job per VM — same isolation semantics as the
    # g5.4xlarge NVIDIA runners). Fallback, if the scale set is ever
    # drained, is the shared PyTorch ROCm pool 1-GPU slice:
    # `linux.rocm.gpu.meta-pytorch.mi350.1` (run-tests.sh only ever
    # uses a single GPU). gfx942 (MI300X) slices are intentionally
    # left out until this job is green.
    #
    # Gating: `workflow_dispatch`-only while stabilizing. The GPU
    # self-hosted pool already queues for hours (see the 2.5h queue
    # on the 2026-09-04 main push); do NOT attach this to
    # pull_request until it is green several dispatches in a row.
    #
    # Known first-run unknown: PYTORCH_ROCM_TAG must match the
    # runner's ROCm major version. `rocm7.1` is verified to exist as
    # a nightly channel (see https://download.pytorch.org/whl/nightly/
    # index, probed 2026-09-07). The Probe step below prints the
    # host's actual ROCm version — if pip refuses the wheel set,
    # adjust the tag to match and re-dispatch.
    # ===================================================================
    test-rocm-nightly:
        if: github.event_name == 'workflow_dispatch'
        runs-on: amd-mi350-runner
        timeout-minutes: 90
        env:
            CONDA_ENV: tritonparse-rocm
            PYTHON_VERSION: "3.14"
            PYTORCH_ROCM_TAG: rocm7.1
            # Same NVIDIA-published Triton nightly feed as the CUDA
            # job: upstream Triton wheels bundle the AMD backend, so
            # the pin + replace logic below is shared unchanged.
            TRITON_NIGHTLY_INDEX_URL: "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/Triton-Nightly/pypi/simple/"
            # HIP honors HIP_VISIBLE_DEVICES; keep CUDA_VISIBLE_DEVICES
            # alongside it since run-tests.sh exports the latter and
            # recent ROCm stacks respect both.
            HIP_VISIBLE_DEVICES: "0"
            CUDA_VISIBLE_DEVICES: "0"
        steps:
            - uses: actions/checkout@v6

            - name: Probe ROCm host
              run: |
                  whoami
                  python3 --version || true
                  command -v conda || ls /opt/conda/bin/conda /opt/miniconda3/bin/conda "$HOME/miniconda3/bin/conda" 2>/dev/null || true
                  rocm-smi 2>/dev/null || true
                  cat /opt/rocm/.info/version 2>/dev/null || true
                  rocminfo 2>/dev/null | grep -m4 -E "Marketing Name|gfx" || true

            - name: Install Miniconda (if missing)
              # The runner host has system Python but no conda (probed
              # 2026-09-07). Install to $HOME (no sudo needed) and
              # export CONDA_HOME for the setup step below. Same
              # installer approach as .ci/setup.sh, user-local path.
              run: |
                  if command -v conda >/dev/null 2>&1 || [[ -x /opt/conda/bin/conda || -x /opt/miniconda3/bin/conda ]]; then
                      echo "conda already present, skipping install"
                      exit 0
                  fi
                  echo "Installing Miniconda to $HOME/miniconda3 ..."
                  wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O /tmp/Miniconda3-latest-Linux-x86_64.sh
                  bash /tmp/Miniconda3-latest-Linux-x86_64.sh -b -u -p "$HOME/miniconda3"
                  echo "CONDA_HOME=$HOME/miniconda3" >> "$GITHUB_ENV"
                  echo "Installed: $("$HOME/miniconda3/bin/conda" --version)"

            - name: Mark workspace as safe for git
              # Same rationale as the NVIDIA jobs: setuptools-scm needs
              # git introspection during 'pip install -e .'.
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Get daily cache timestamp
              id: daily-cache
              run: |
                  DATE_STAMP=$(date +"%Y-%m-%d")
                  echo "date=$DATE_STAMP" >> $GITHUB_OUTPUT
                  echo "Using daily cache stamp: $DATE_STAMP"

            - name: Cache pip dependencies
              uses: actions/cache@v5
              with:
                  # Host-direct run (no container), so pip's cache is
                  # under the runner user's real HOME — NOT
                  # /github/home as in the container jobs.
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ env.PYTORCH_ROCM_TAG }}-py${{ env.PYTHON_VERSION }}-${{ steps.daily-cache.outputs.date }}
                  restore-keys: |
                      ${{ runner.os }}-pip-${{ env.PYTORCH_ROCM_TAG }}-py${{ env.PYTHON_VERSION }}-

            - name: Setup conda env + PyTorch ROCm nightly + Triton nightly
              env:
                  # Same as the CUDA job: lets the Triton-nightly
                  # resolver below authenticate to the GitHub API.
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  # Locate conda: PATH first, then CONDA_HOME (set by the
                  # Miniconda step when it had to install), then the
                  # well-known prefixes. Fail fast with a clear message
                  # (the Probe step above shows what the host has).
                  CONDA_BIN="$(command -v conda 2>/dev/null || true)"
                  for candidate in "${CONDA_HOME:-}/bin/conda" /opt/conda/bin/conda /opt/miniconda3/bin/conda "$HOME/miniconda3/bin/conda"; do
                      if [[ -z "$CONDA_BIN" && -x "$candidate" ]]; then
                          CONDA_BIN="$candidate"
                      fi
                  done
                  if [[ -z "$CONDA_BIN" ]]; then
                      echo "ERROR: conda not found (PATH, CONDA_HOME, /opt/conda, /opt/miniconda3, ~/miniconda3)."
                      echo "See the 'Probe ROCm host' step output and either provision conda or extend this search."
                      exit 1
                  fi
                  echo "Using conda: $CONDA_BIN"
                  eval "$("$CONDA_BIN" shell.bash hook)"
                  # NOTE: explicitly request `pip`: conda-forge's
                  # `python` package does NOT pull pip in by default
                  # (same caveat as .ci/setup.sh).
                  conda create -n "$CONDA_ENV" python="$PYTHON_VERSION" pip -y -c conda-forge
                  conda activate "$CONDA_ENV"

                  # PyTorch nightly for ROCm. These are wheel-based
                  # installs (bundled ROCm user-space libs); only the
                  # kernel driver comes from the host, so the tag must
                  # match the host ROCm major version (see job header).
                  pip install --pre torch torchvision torchaudio \
                      --index-url "https://download.pytorch.org/whl/nightly/${PYTORCH_ROCM_TAG}"
                  pip install packaging
                  python -c "import torch; print(f'torch: {torch.__version__}'); print(f'cuda available (HIP backend): {torch.cuda.is_available()}')"

                  # Replace the pytorch-triton snapshot with the upstream
                  # Triton nightly (bundles the AMD backend), pinning to
                  # upstream HEAD via the same resolver as the CUDA job.
                  pip uninstall -y pytorch-triton triton 2>/dev/null || true
                  PY_TAG=$(python -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')
                  PIN=$(python .ci/triton_nightly_pin.py --pytag "$PY_TAG" --platform x86_64) || PIN=""
                  if [[ "$PIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+git[0-9a-f]+$ ]]; then
                      echo "Pinning Triton nightly to upstream HEAD: triton==$PIN"
                      pip install "triton==$PIN" \
                          --extra-index-url "${TRITON_NIGHTLY_INDEX_URL}"
                  else
                      echo "Resolver did not produce a valid pin (got: '$PIN'); falling back to default"
                      pip install -U --pre triton \
                          --extra-index-url "${TRITON_NIGHTLY_INDEX_URL}"
                  fi
                  python -c "import triton; print(f'Triton: {triton.__version__} from {triton.__file__}')"

            - name: Install project dependencies
              run: |
                  bash .ci/install-project.sh

            - name: Run tests
              env:
                  TEST_TYPE: ${{ github.event.inputs.test-type || 'all' }}
                  COVERAGE: ${{ github.event.inputs.coverage || 'false' }}
              run: |
                  bash .ci/run-tests.sh
